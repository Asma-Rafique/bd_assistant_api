# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  errors:
    unauthenticated: "You need to sign in to continue."
    forbidden: "You don't have permission to do that."
    not_found: "We couldn't find what you were looking for."
    internal: "Something went wrong on our side. Please try again."
    malformed_request: "The request was invalid or badly formatted."
    validation_failed: "Please check the highlighted fields."
    invalid_credentials: "Invalid email or password."
    current_password_invalid: "Current password is incorrect."
    invalid_token: "This link is invalid or has expired. Please request a new one."
    sign_in_blocked: "This account can no longer sign in. Please contact an admin."
  auth:
    logged_out: "You have been logged out."
    password_reset_requested: "If an account exists for that email, we've sent a link to reset the password."
  user_mailer:
    password_reset:
      subject: "Reset your BD Assistant password"
      greeting: "Hi %{name},"
      intro: "Someone asked to reset the password for your account. Use the link below to choose a new one."
      button: "Reset my password"
      expiry: "The link works for 15 minutes, and only once."
      ignore: "If you didn't ask for this, you can ignore this email. Your password won't change."      
  activerecord:
    errors:
      messages:
        password_missing_uppercase: "must include an uppercase letter"
        password_missing_lowercase: "must include a lowercase letter"
        password_missing_special: "must include a special character"
        password_too_long: "is too long (maximum is %{count} bytes)"

