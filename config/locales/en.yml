      instructions: "Use the link below to choose your password and sign in."
      button: "Accept the invitation"
      expiry: "The link works for %{days} days."
  user_mailer:
    verification_code:
      subject:
        login: "Your BD Assistant sign-in code"
        password_reset: "Your BD Assistant password reset code"
      greeting: "Hi %{name},"
      intro:
        login: "Use this code to finish signing in:"
        password_reset: "Use this code to reset your password:"
