    forbidden: "You don't have permission to do that."
    not_found: "We couldn't find what you were looking for."
    internal: "Something went wrong on our side. Please try again."
    malformed_request: "The request was invalid or badly formatted."
    validation_failed: "Please check the highlighted fields."
    invalid_credentials: "Invalid email or password."
    current_password_invalid: "Current password is incorrect."
    invalid_token: "This link is invalid or has expired. Please request a new one."
    invalid_code: "This code is wrong or has expired."
    code_locked: "Too many wrong attempts. Please request a new code."
    code_not_pending: "This code has expired. Please start again to get a new one."
    resend_cooldown: "Please wait a few seconds before asking for another code."
    sign_in_blocked: "This account can no longer sign in. Please contact an admin."
    invitation_count: "Invite between 1 and %{count} email addresses at a time."
    emails_taken: "These emails already have an account: %{emails}."
    rate_limited: "Too many attempts. Please wait a few minutes and try again."
  auth:
    logged_out: "You have been logged out."
    signed_in: "You're signed in."
    verification_code_sent: "We've emailed you a 6-digit code."
    verification_code_resent: "We've emailed you a new code."
    password_reset_requested: "If an account exists for that email, we've sent a code to reset the password."
  invitations:
    sent:
      one: "Invitation sent."
      other: "%{count} invitations sent."
    deleted: "Invitation deleted."
  invitation_mailer:
    invitation:
      subject: "You're invited to BD Assistant"
      intro: "You've been invited to join BD Assistant."
